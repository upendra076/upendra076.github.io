<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brick Toe - Offline Puzzles</title>
  <style>
    body { margin: 0; font-family: -apple-system, Roboto, Arial, sans-serif;
           background: linear-gradient(160deg, #17123F, #2B1257); color: #fff;

    main { max-width: 520px; padding: 32px 20px; text-align: center; }

  <main>
